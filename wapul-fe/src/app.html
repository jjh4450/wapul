<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <title>왜 풀렸을까요? 와플!</title>
    <meta
      name="description"
      content="왜 풀렸을까요? 알고리즘을 푸는데 멈추지 말고, 한번 복기해봐요!"
    />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <!--
      링크 미리보기(카카오톡, 슬랙 등)는 JS를 실행하지 않아서 여기에 직접 둔다.
      og:image는 절대 주소여야 해서 배포 주소를 적는다.
      og:url은 두지 않는다: 저장 링크(/share#...)가 홈 주소로 바뀌어 공유될 수 있다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="와풀" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="왜풀? 와풀!" />
    <meta
      property="og:description"
      content="왜 풀렸을까요? 알고리즘을 푸는데 멈추지 말고, 한번 복기해봐요!"
    />
    <meta property="og:image" content="https://wapul.jeje.work/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="와풀 로고와 '왜풀? 와풀!'" />
    <meta name="twitter:card" content="summary_large_image" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
