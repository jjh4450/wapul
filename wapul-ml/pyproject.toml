[project]
name = "wapul-ml"
version = "0.1.0"
description = "Block-splitting model: statement kinds and logic block grouping"
requires-python = ">=3.11"
dependencies = [
    "lightgbm",
    "numpy",
    "scikit-learn",
    "sentence-transformers[train]",
    "torch",
    "tree-sitter==0.26.0",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python==0.25.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

# RTX 50xx (Blackwell) needs CUDA 12.8+; the driver here supports up to 13.0
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# notebooks/*.py are the notebooks; Jupyter keeps their outputs in a git-ignored .ipynb beside each
[tool.jupytext]
formats = "ipynb,py:percent"
notebook_metadata_filter = "-all"
cell_metadata_filter = "-all"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Same rules as wapul-be: defaults (E4/E7/E9/F) + mutable defaults etc. (B), Any abuse, broad except, bare type: ignore
select = ["E4", "E7", "E9", "F", "B", "ANN401", "BLE", "PGH003"]
