name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'wapul-be/**'
      - '.github/workflows/be-ci.yml'
  pull_request:
    paths:
      - 'wapul-be/**'
      - '.github/workflows/be-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: wapul-be

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: wapul-be/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Run tests
        run: uv run pytest
