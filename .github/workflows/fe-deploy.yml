name: Frontend Deploy

# 버전은 여기서 계산하고, 빌드/배포는 호스팅(Vercel 등)이 deploy/fe 브랜치를 추적해서 한다.
# deploy/fe = 릴리스한 main 커밋 + wapul-fe/VERSION 파일 커밋 하나 (매번 강제 갱신)
on:
  push:
    branches: [ main ]
    paths:
      - 'wapul-fe/**'
      - 'openapi/**'
      - '.github/workflows/fe-deploy.yml'
  workflow_dispatch:
    inputs:
      major:
        description: 'X 버전 올리기'
        type: boolean
        default: false

# 버전 계산이 직전 릴리스 태그에 의존하므로 실행을 직렬화
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 버전 fe-vX.Y.Z: X는 수동(major 입력), Y는 API 계약(openapi info.version) 변경 시, Z는 그 외 릴리스마다 증가
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          LAST=$(git tag --list 'fe-v*' | grep -E '^fe-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          # 릴리스 태그는 annotated 태그이고 메시지에 해당 릴리스의 API 계약 버전을 기록한다
          LAST_CONTRACT=""
          if [ -n "$LAST" ]; then
            LAST_CONTRACT=$(git tag --list --format='%(contents:subject)' "$LAST" | sed -n 's/^api-contract: //p')
            # 이미 릴리스된 커밋이면 건너뜀 (수동 재실행)
            if [ "$MAJOR" != "true" ] && [ "$(git rev-list -n1 "$LAST")" = "$(git rev-parse HEAD)" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          CONTRACT=$(jq -r .info.version openapi/openapi.json)
          if [ -z "$LAST" ]; then
            VERSION="1.0.0"
          else
            IFS=. read -r X Y Z <<< "${LAST#fe-v}"
            if [ "$MAJOR" = "true" ]; then
              VERSION="$((X + 1)).0.0"
            elif [ "$CONTRACT" != "$LAST_CONTRACT" ]; then
              VERSION="${X}.$((Y + 1)).0"
            else
              VERSION="${X}.${Y}.$((Z + 1))"
            fi
          fi
          {
            echo "skip=false"
            echo "version=${VERSION}"
            echo "contract=${CONTRACT}"
          } >> $GITHUB_OUTPUT

      - name: Configure git
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 배포 브랜치를 먼저 갱신하고, 성공하면 소스 커밋에 태그를 남겨 다음 릴리스의 Y 판정에 쓴다
      - name: Push deploy branch and tag
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: fe-v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          CONTRACT: ${{ steps.version.outputs.contract }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "$VERSION" > wapul-fe/VERSION
          git add wapul-fe/VERSION
          git commit -m "chore: release $TAG"
          git push --force origin HEAD:refs/heads/deploy/fe

          git tag -a "$TAG" "$SHA" -m "api-contract: $CONTRACT"
          git push origin "$TAG"
