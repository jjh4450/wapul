name: Docs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'overrides/**'
      - 'mkdocs.yml'
      - 'CONTRIBUTING*.md'  # include-markdown → project/contributing.*.md
      - 'CODE_OF_CONDUCT.md'  # include-markdown → project/code-of-conduct.*.md
      - 'SECURITY.md'  # include-markdown → project/security.*.md
      - 'wapul-be/app/**'  # OpenAPI 스펙 변경 감지
      - 'wapul-be/README*.md'  # include-markdown → backend/index.*.md
      - 'wapul-be/CHANGELOG.md'  # include-markdown → project/changelog.*.md
      - 'LICENSE'  # include-markdown → project/license.*.md
      - 'wapul-be/uv.lock'
      - 'wapul-fe/src/**'  # Storybook 스토리/컴포넌트
      - 'wapul-fe/.storybook/**'
      - 'wapul-fe/package.json'
      - 'wapul-fe/pnpm-lock.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: wapul-be/uv.lock

      - name: Install docs dependencies
        run: uv sync --project wapul-be --locked --no-dev --group docs

      - name: Generate OpenAPI JSON
        working-directory: wapul-be
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          OIDC_ENABLED=false DATABASE_URL='sqlite:///:memory:' APP_VERSION="$VERSION" uv run --no-sync python -c "
          import json
          from app.main import app
          with open('../docs/backend/api/openapi.json', 'w') as f:
              json.dump(app.openapi(), f, indent=2)
          "

      - name: Fetch OG preview image
        continue-on-error: true
        run: |
          mkdir -p docs/assets
          curl -sfL --max-time 5 "https://opengraph.githubassets.com/1/${{ github.repository }}" -o docs/assets/preview.png

      - name: Build MkDocs
        run: uv run --project wapul-be --no-sync mkdocs build # --strict

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: wapul-fe/pnpm-lock.yaml

      - name: Build Storybook
        working-directory: wapul-fe
        run: |
          pnpm install --frozen-lockfile
          pnpm build-storybook --output-dir ../site/storybook

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
