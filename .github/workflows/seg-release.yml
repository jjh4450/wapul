name: Segmenter Release

# 릴리즈 seg-vX.Y.Z: 모듈, WASM, 문법, 모델 파일을 한 벌로 담은 npm 패키지 wapul-seg@X.Y.Z.
# npm 인증: trusted publishing(OIDC)을 먼저 시도하고, 안 되면 NPM_TOKEN 시크릿(granular token)을 쓴다.
# 이 저장소는 2026-07-15 이후 생성이라 OIDC sub가 immutable 형식(repo:owner@id/repo@id)인데, npm이
# 아직 이를 받지 않는다 (npm/cli#9969). 고쳐지면 npmjs.com 패키지 설정에 trusted publisher
# (jjh4450/wapul, seg-release.yml)를 등록하고 시크릿을 지운다 (docs/ml/deploy.ko.md).
on:
  push:
    branches: [ main ]
    paths:
      - 'wapul-seg/**'
      - 'model/**'
      - '.github/actions/seg-build/**'
      - '.github/workflows/seg-release.yml'
  workflow_dispatch:
    inputs:
      major:
        description: 'X 버전 올리기 (segment() 결과 형식이나 호출 방식 변경)'
        type: boolean
        default: false

# 버전 계산이 직전 릴리스 태그에 의존하므로 실행을 직렬화
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  # 버전 seg-vX.Y.Z: X는 수동(major 입력), Y는 모델 파일(model/)이 바뀌면, Z는 그 외 릴리스마다 증가
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          LAST=$(git tag --list 'seg-v*' | grep -E '^seg-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          # 릴리스 태그는 annotated 태그이고 메시지에 그 릴리스의 모델 해시를 기록한다
          LAST_MODEL=""
          if [ -n "$LAST" ]; then
            LAST_MODEL=$(git tag --list --format='%(contents:subject)' "$LAST" | sed -n 's/^model: //p')
            # 이미 릴리스된 커밋이면 건너뜀 (수동 재실행)
            if [ "$MAJOR" != "true" ] && [ "$(git rev-list -n1 "$LAST")" = "$(git rev-parse HEAD)" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          MODEL=$(cat model/kinds-lgbm.txt model/kinds-features.txt model/blocks-lgbm.txt | sha256sum | cut -c1-16)
          if [ -z "$LAST" ]; then
            VERSION="1.0.0"
          else
            IFS=. read -r X Y Z <<< "${LAST#seg-v}"
            if [ "$MAJOR" = "true" ]; then
              VERSION="$((X + 1)).0.0"
            elif [ "$MODEL" != "$LAST_MODEL" ]; then
              VERSION="${X}.$((Y + 1)).0"
            else
              VERSION="${X}.${Y}.$((Z + 1))"
            fi
          fi
          {
            echo "skip=false"
            echo "version=${VERSION}"
            echo "model=${MODEL}"
          } >> $GITHUB_OUTPUT

      - if: steps.version.outputs.skip != 'true'
        uses: ./.github/actions/seg-build

      # npm publish가 registry와 OIDC 교환을 하도록 registry-url을 둔다 (seg-build와 같은 node)
      - if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Test
        if: steps.version.outputs.skip != 'true'
        working-directory: wapul-seg
        run: |
          cargo test --release
          cd js && pnpm test

      # package.json의 version은 0.0.0 자리표시자이고 커밋하지 않는다.
      # NODE_AUTH_TOKEN은 setup-node가 .npmrc에 넣는다; npm은 OIDC 교환이 실패하면 이 토큰으로 publish한다
      - name: Publish to npm
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: wapul-seg/js
        run: |
          # 재실행이면 이미 올라가 있다 (태그만 못 단 경우)
          if npm view "wapul-seg@$VERSION" version >/dev/null 2>&1; then
            echo "wapul-seg@$VERSION is already on npm"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version
          npm publish --provenance --access public
          # 레지스트리 반영은 비동기라 1분쯤 걸린다. 끝내 안 보이면 승인 대기(staged)로 멈춘 것
          for i in $(seq 1 18); do
            if npm view "wapul-seg@$VERSION" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::wapul-seg@$VERSION is not on the registry after 3 minutes; check staged versions on npmjs.com"
          exit 1

      # 태그는 빌드한 커밋에 붙이고, 메시지에 모델 해시를 남겨 다음 릴리스의 Y 판정에 쓴다
      - name: Create tag and GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: seg-v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          MODEL: ${{ steps.version.outputs.model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" HEAD -m "model: $MODEL"
          git push origin "$TAG"
          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            --title "Segmenter $TAG" \
            --notes "npm: https://www.npmjs.com/package/wapul-seg/v/$VERSION
          Model: \`$MODEL\` (sha256 of model/*.txt, first 16 hex)"
