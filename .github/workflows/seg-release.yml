name: Segmenter Release

# 릴리즈 seg-vX.Y.Z: 모듈, WASM, 문법, 모델 파일을 한 벌로 묶은 GitHub Release.
# 프론트엔드는 SEGMENTER_VERSION에 적힌 릴리즈를 빌드할 때 받는다 (docs/ml/deploy.ko.md).
on:
  push:
    branches: [ main ]
    paths:
      - 'wapul-seg/**'
      - 'model/**'
      - '.github/actions/seg-build/**'
      - '.github/workflows/seg-release.yml'
  workflow_dispatch:
    inputs:
      major:
        description: 'X 버전 올리기 (segment() 결과 형식이나 호출 방식 변경)'
        type: boolean
        default: false

# 버전 계산이 직전 릴리스 태그에 의존하므로 실행을 직렬화
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 버전 seg-vX.Y.Z: X는 수동(major 입력), Y는 모델 파일(model/)이 바뀌면, Z는 그 외 릴리스마다 증가
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          MAJOR: ${{ inputs.major }}
        run: |
          LAST=$(git tag --list 'seg-v*' | grep -E '^seg-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          # 릴리스 태그는 annotated 태그이고 메시지에 그 릴리스의 모델 해시를 기록한다
          LAST_MODEL=""
          if [ -n "$LAST" ]; then
            LAST_MODEL=$(git tag --list --format='%(contents:subject)' "$LAST" | sed -n 's/^model: //p')
            # 이미 릴리스된 커밋이면 건너뜀 (수동 재실행)
            if [ "$MAJOR" != "true" ] && [ "$(git rev-list -n1 "$LAST")" = "$(git rev-parse HEAD)" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          MODEL=$(cat model/kinds-lgbm.txt model/kinds-features.txt model/blocks-lgbm.txt | sha256sum | cut -c1-16)
          if [ -z "$LAST" ]; then
            VERSION="1.0.0"
          else
            IFS=. read -r X Y Z <<< "${LAST#seg-v}"
            if [ "$MAJOR" = "true" ]; then
              VERSION="$((X + 1)).0.0"
            elif [ "$MODEL" != "$LAST_MODEL" ]; then
              VERSION="${X}.$((Y + 1)).0"
            else
              VERSION="${X}.${Y}.$((Z + 1))"
            fi
          fi
          {
            echo "skip=false"
            echo "version=${VERSION}"
            echo "model=${MODEL}"
          } >> $GITHUB_OUTPUT

      - if: steps.version.outputs.skip != 'true'
        uses: ./.github/actions/seg-build

      - name: Test
        if: steps.version.outputs.skip != 'true'
        working-directory: wapul-seg
        run: |
          cargo test --release
          cd js && pnpm test

      - name: Package
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: wapul-seg/js
        run: |
          echo "seg-v${VERSION}" > dist/VERSION
          tar czf "../../wapul-seg-${VERSION}.tar.gz" -C dist .
          sha256sum "../../wapul-seg-${VERSION}.tar.gz" > "../../wapul-seg-${VERSION}.tar.gz.sha256"

      # 태그는 빌드한 커밋에 붙이고, 메시지에 모델 해시를 남겨 다음 릴리스의 Y 판정에 쓴다
      - name: Create tag and GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: seg-v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          MODEL: ${{ steps.version.outputs.model }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" HEAD -m "model: $MODEL"
          git push origin "$TAG"
          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            --title "Segmenter $TAG" \
            --notes "Model: \`$MODEL\` (sha256 of model/*.txt, first 16 hex)
          Contents: wapul-seg.js, wapul_seg_bg.wasm, web-tree-sitter.wasm, grammars/*.wasm, model/*" \
            "wapul-seg-${VERSION}.tar.gz" "wapul-seg-${VERSION}.tar.gz.sha256"
